name: iOS 빌드 및 테스트

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Xcode 빌드 · 단위 테스트 · UI 테스트
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전 확인
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS

      - name: 시뮬레이터 선택
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in data if "iOS" in k), reverse=True)
          for runtime in runtimes:
              for device in data[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: 빌드 (테스트 포함)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project DokkaebiWallet.xcodeproj \
            -scheme DokkaebiWallet \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "(error|warning):|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST BUILD SUCCEEDED" build.log

      - name: 단위 테스트
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DokkaebiWallet.xcodeproj \
            -scheme DokkaebiWallet \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:DokkaebiWalletTests \
            | tee unit.log | grep -E "✔|✘|Test Suite|Test Case.*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST EXECUTE SUCCEEDED" unit.log

      - name: UI 테스트
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DokkaebiWallet.xcodeproj \
            -scheme DokkaebiWallet \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:DokkaebiWalletUITests \
            | tee ui.log | grep -E "AUDIT-ISSUE|Test Case.*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST EXECUTE SUCCEEDED" ui.log

      - name: 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: '*.log'
